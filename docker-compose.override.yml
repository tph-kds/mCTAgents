services:
  # =============================================================================
  # Development Overrides
  # =============================================================================

  api-gateway:
    command: ["go", "run", "./cmd/api-gateway"]
    environment:
      - LOG_LEVEL=debug

  reasoning-engine:
    command: ["uvicorn", "mctagents.api.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1

  model-gateway:
    command: ["go", "run", "./cmd/model-gateway"]

  evidence-service:
    command: ["uvicorn", "mctagents.api.app:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1

  studio:
    command: ["pnpm", "dev"]
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_SSE_URL=http://localhost:8080

  sglang:
    command: >
      --model Qwen/Qwen3-1.7B
      --reasoning-parser qwen3
      --host 0.0.0.0
      --port 30000
      --context-length 4096
      --mem-fraction-static 0.7

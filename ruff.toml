line-length = 88
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "COM", "C4", "DTZ", "ISC", "ICN", "PIE", "PT", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA"]
ignore = ["E501"]

[lint.per-file-ignores]
"tests/**" = ["S101"]

[lint.isort]
known-first-party = ["mctagents"]

# Production Docker Compose
# Usage: docker compose -f deployments/docker-compose/docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mctagents
      POSTGRES_USER: mctagents
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ${DOCKER_DATA_ROOT:-/home/zyelyhero/mctagents-data}/pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mctagents"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - ${DOCKER_DATA_ROOT:-/home/zyelyhero/mctagents-data}/qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ${DOCKER_DATA_ROOT:-/home/zyelyhero/mctagents-data}/ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  api-gateway:
    build:
      context: ./services/api-gateway
      target: production
    ports:
      - "8080:8080"
    environment:
      REASONING_ENGINE_URL: http://reasoning-engine:8000
      EVIDENCE_SERVICE_URL: http://evidence-service:8001
      LOG_LEVEL: info
    depends_on:
      reasoning-engine:
        condition: service_healthy
      evidence-service:
        condition: service_healthy
    restart: unless-stopped

  reasoning-engine:
    build:
      context: ./services/reasoning-engine
      target: production
    environment:
      DATABASE_URL: postgres://mctagents:${POSTGRES_PASSWORD}@postgres:5432/mctagents
      OLLAMA_BASE_URL: http://ollama:11434
      DEFAULT_CHAT_MODEL: ${DEFAULT_CHAT_MODEL:-qwen2.5:7b}
      DEFAULT_REASONING_MODEL: ${DEFAULT_REASONING_MODEL:-deepseek-r1:7b}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  evidence-service:
    build:
      context: ./services/evidence-service
      target: production
    environment:
      QDRANT_HOST: qdrant
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: ${DEFAULT_EMBEDDING_MODEL:-nomic-embed-text}
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  model-gateway:
    build:
      context: ./services/model-gateway
      target: production
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

volumes:
  # All data volumes use explicit bind mounts on /home partition
  # via DOCKER_DATA_ROOT env var (default: /home/zyelyhero/mctagents-data)

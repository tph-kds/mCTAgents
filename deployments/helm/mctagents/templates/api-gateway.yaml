apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mctagents.fullname" . }}-api-gateway
  labels:
    {{- include "mctagents.labels" . | nindent 4 }}
    app: api-gateway
spec:
  replicas: {{ .Values.replicaCount.apiGateway }}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: "{{ .Values.image.repository }}/api-gateway:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: REASONING_ENGINE_URL
              value: "http://{{ include "mctagents.fullname" . }}-reasoning-engine:8000"
            - name: EVIDENCE_SERVICE_URL
              value: "http://{{ include "mctagents.fullname" . }}-evidence-service:8001"
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources.apiGateway | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mctagents.fullname" . }}-api-gateway
  labels:
    {{- include "mctagents.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: api-gateway
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080

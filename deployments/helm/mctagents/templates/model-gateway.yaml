apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mctagents.fullname" . }}-model-gateway
  labels:
    {{- include "mctagents.labels" . | nindent 4 }}
    app: model-gateway
spec:
  replicas: {{ .Values.replicaCount.modelGateway }}
  selector:
    matchLabels:
      app: model-gateway
  template:
    metadata:
      labels:
        app: model-gateway
    spec:
      containers:
        - name: model-gateway
          image: "{{ .Values.image.repository }}/model-gateway:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8090
          env:
            - name: OLLAMA_BASE_URL
              value: {{ .Values.config.ollamaBaseUrl | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mctagents.fullname" . }}-model-gateway
  labels:
    {{- include "mctagents.labels" . | nindent 4 }}
spec:
  selector:
    app: model-gateway
  ports:
    - port: 8090
      targetPort: 8090

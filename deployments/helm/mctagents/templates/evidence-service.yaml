apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mctagents.fullname" . }}-evidence-service
  labels:
    {{- include "mctagents.labels" . | nindent 4 }}
    app: evidence-service
spec:
  replicas: {{ .Values.replicaCount.evidenceService }}
  selector:
    matchLabels:
      app: evidence-service
  template:
    metadata:
      labels:
        app: evidence-service
    spec:
      containers:
        - name: evidence-service
          image: "{{ .Values.image.repository }}/evidence-service:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8001
          env:
            - name: QDRANT_HOST
              value: "{{ include "mctagents.fullname" . }}-qdrant"
            - name: OLLAMA_BASE_URL
              value: {{ .Values.config.ollamaBaseUrl | quote }}
            - name: EMBEDDING_MODEL
              value: {{ .Values.config.defaultEmbeddingModel | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources.evidenceService | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mctagents.fullname" . }}-evidence-service
  labels:
    {{- include "mctagents.labels" . | nindent 4 }}
spec:
  selector:
    app: evidence-service
  ports:
    - port: 8001
      targetPort: 8001

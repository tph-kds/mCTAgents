apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: mctagents
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: mctagents/api-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: REASONING_ENGINE_URL
              value: http://reasoning-engine:8000
            - name: EVIDENCE_SERVICE_URL
              value: http://evidence-service:8001
            - name: LOG_LEVEL
              value: info
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: mctagents
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8080

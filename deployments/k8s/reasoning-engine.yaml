apiVersion: apps/v1
kind: Deployment
metadata:
  name: reasoning-engine
  namespace: mctagents
  labels:
    app: reasoning-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reasoning-engine
  template:
    metadata:
      labels:
        app: reasoning-engine
    spec:
      containers:
        - name: reasoning-engine
          image: mctagents/reasoning-engine:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgres://mctagents:$(POSTGRES_PASSWORD)@postgres:5432/mctagents
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mctagents-secrets
                  key: postgres-password
            - name: OLLAMA_BASE_URL
              value: http://ollama:11434
            - name: DEFAULT_CHAT_MODEL
              value: qwen2.5:7b
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: reasoning-engine
  namespace: mctagents
spec:
  selector:
    app: reasoning-engine
  ports:
    - port: 8000
      targetPort: 8000
